name: Bootstrap and dshortcuts checks
on:
  push:
  pull_request:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/check.sh
  dshortcuts-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install X11 build libraries
        run: sudo apt-get update && sudo apt-get install -y build-essential git patch libx11-dev libxft-dev libxinerama-dev libxext-dev libfontconfig1-dev libfreetype-dev xvfb xauth
      - name: Build pinned dshortcuts without root
        run: sh lib/dshortcuts-setup.sh --yes && sh lib/dshortcuts-setup.sh --verify
      - name: Check menu and absence of legacy shell references
        run: '! grep -E "SCRIPT_DSHORTCUTS|SCRIPT_ROFI|~/.bash_scripts" profiles/dshortcuts/items.h'
      - name: Navigate into nested menus under Xvfb without crashing
        run: |
          for path in m r "m v" "m b"; do
            code=0
            # timeout=124 means the menu stayed open, waiting for keyboard input.
            xvfb-run -a timeout 3s "$HOME/.local/bin/dshortcuts" $path || code=$?
            if [ "$code" -ne 124 ]; then
              echo "Submenú '$path' falló con código $code"
              exit 1
            fi
          done
  dshortcuts-alpine:
    runs-on: ubuntu-latest
    container: alpine:3.24
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build toolchain
        run: apk add --no-cache build-base git patch libx11-dev libxft-dev libxinerama-dev libxext-dev fontconfig-dev freetype-dev ca-certificates
      - name: Check real build as unprivileged user
        run: |
          adduser -D tester
          su tester -s /bin/sh -c "cd '$GITHUB_WORKSPACE' && sh lib/dshortcuts-setup.sh --yes && sh lib/dshortcuts-setup.sh --verify"

  dwm-rofi-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dwm compilation dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential git patch libx11-dev libxft-dev libxinerama-dev libxrender-dev libxcomposite-dev libimlib2-dev libxext-dev libfontconfig1-dev
      - name: Apply Rofi window focus patch to clean dwm fork
        run: |
          git clone --depth 1 https://github.com/agusc01/dwm.git /tmp/dwm-rofi-test
          patch -s -d /tmp/dwm-rofi-test -p1 --dry-run < profiles/dwm/rofi-window-focus.patch
          patch -s -d /tmp/dwm-rofi-test -p1 < profiles/dwm/rofi-window-focus.patch
          grep -Fq 'linux-setup: rofi-window-focus' /tmp/dwm-rofi-test/dwm.c
      - name: Compile patched dwm
        run: make -C /tmp/dwm-rofi-test clean all

  suckless-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dwm, st and slock without system installation
        run: sh lib/suckless-setup.sh --modules dwm,st,slock --build-only --yes

  suckless-alpine:
    runs-on: ubuntu-latest
    container: alpine:3.24
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build environment using stable main + temporary community
        run: |
          apk add --no-cache build-base git pkgconf libx11-dev libxft-dev libxinerama-dev libxrender-dev libxcomposite-dev libxext-dev fontconfig-dev freetype-dev libxrandr-dev ncurses xorg-server xinit ca-certificates
          apk add --no-cache --repository https://dl-cdn.alpinelinux.org/alpine/v3.24/community imlib2-dev
      - name: Verify all pinned forks build as unprivileged user
        run: |
          adduser -D tester
          su tester -s /bin/sh -c "cd '$GITHUB_WORKSPACE' && sh lib/suckless-setup.sh --modules dwm,st,slock --build-only --yes"
